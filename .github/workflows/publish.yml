    name: Publish to GitHub Packages
    on:
      release:
        types: [created]
      workflow_dispatch:

    jobs:
      publish:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - uses: actions/checkout@v4
          - name: Set up JDK 17
          - uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'
              cache: 'gradle'
         
          - name: Grant execute permission for gradlew # ADICIONE ESTE PASSO
            run: chmod +x gradlew
          
          - name: Publish package
            run: ./gradlew publish
            env:
              GITHUB_ACTOR: ${{ github.actor }}
              GITHUB_TOKEN: ${{ secrets.GPR_PUBLISH_TOKEN }}
