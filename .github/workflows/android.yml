name: Android CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test All Modules
        run: ./gradlew test assemble

      - name: Verify Core Module
        run: ./gradlew :core:test :core:assemble

      - name: Verify Compose Module
        run: ./gradlew :compose:test :compose:assemble
