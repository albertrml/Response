    name: Android CI

    on:
      push:
        branches: [ "main", "develop" ]
      pull_request:
        branches: [ "main", "develop" ]

    jobs:
      build:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: gradle

        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        - name: List gradle wrapper contents # Adicione este passo para depuração
          run: ls -la gradle/wrapper
          
        - name: Build with Gradle
          run: ./gradlew build

        - name: Upload aab as artifact
          uses: actions/upload-artifact@v4
          with:
            name: app-release-aab
            path: app/build/outputs/bundle/release/app-release.aab # Ajuste o caminho conforme seu projeto
